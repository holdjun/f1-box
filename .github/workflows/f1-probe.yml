name: f1-probe

# FastF1 livetiming 可用性探针。天气管线只消费 FastF1；代表性 session 全部
# 不可用时必须红灯，不能把日志里的 FAILED 包装成成功结论。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: |
          python3 -m pip install --quiet --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Probe FastF1 weather data
        run: |
          cat > /tmp/probe-fastf1.py <<'PY'
          # /// script
          # requires-python = ">=3.12"
          # dependencies = ["fastf1>=3.5"]
          # ///
          import datetime
          import requests

          HOSTS: set[str] = set()
          _real_send = requests.adapters.HTTPAdapter.send

          def _recording_send(self, request, *args, **kwargs):
              HOSTS.add(requests.utils.urlparse(request.url).netloc.lower())
              try:
                  response = _real_send(self, request, *args, **kwargs)
              except requests.RequestException as exc:
                  print(f"HTTP {request.url}: {type(exc).__name__}", flush=True)
                  raise
              print(f"HTTP {response.status_code} {request.url}", flush=True)
              return response

          requests.adapters.HTTPAdapter.send = _recording_send

          import fastf1
          import fastf1.api as api

          print(f"FastF1 {fastf1.__version__}; requests {requests.__version__}", flush=True)
          # 探针验证当前网络可用性，不能由旧的成功缓存代答。
          fastf1.Cache.set_disabled()
          fastf1.set_log_level("WARNING")
          now = datetime.datetime.now(datetime.timezone.utc)
          schedule = fastf1.get_event_schedule(
              now.year,
              backend="fastf1",
              include_testing=False,
          )
          past = [
              row
              for _, row in schedule.iterrows()
              if row["EventDate"] is not None
              and str(row["EventDate"])[:10] < now.strftime("%Y-%m-%d")
          ]
          probes = [(2023, 1)]
          if past:
              probes.append((now.year, int(past[-1]["RoundNumber"])))

          successful_weather = 0
          for year, round_no in probes:
              print(f"=== {year} R{round_no} Qualifying ===")
              try:
                  session = fastf1.get_session(
                      year,
                      round_no,
                      "Qualifying",
                      backend="fastf1",
                  )
                  print("  api_path:", session.api_path)
                  weather = api.weather_data(session.api_path)
                  if weather is None:
                      rows = 0
                      columns = []
                  elif hasattr(weather, "columns"):
                      columns = list(weather.columns)
                      rows = len(weather)
                  else:
                      columns = list(weather.keys())
                      rows = max(
                          (len(value) for value in weather.values() if isinstance(value, list)),
                          default=0,
                      )
                  if rows == 0:
                      print("  weather_data EMPTY")
                  else:
                      successful_weather += 1
                      print(f"  weather_data OK rows={rows} columns={columns}")
              except Exception as exc:
                  print(f"  weather_data FAILED: {type(exc).__name__}: {exc}")

          print("=== hosts touched (requests layer) ===")
          for host in sorted(HOSTS):
              print(" ", host)
          if not HOSTS:
              raise SystemExit("request recorder captured no hosts")
          banned = [host for host in HOSTS if "jolpi" in host or "ergast" in host]
          if banned:
              raise SystemExit(f"banned hosts touched: {banned}")
          if successful_weather == 0:
              raise SystemExit("no FastF1 weather sample was available")
          PY
          uv run --quiet /tmp/probe-fastf1.py

      - name: Summary
        if: always()
        run: |
          echo "天气只来自 FastF1 weather_data；无数据时页面保持空白。"
          echo "零成功样本、记录器失效或触达 jolpica/ergast 都会让探针失败。"
