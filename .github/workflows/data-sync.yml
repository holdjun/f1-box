name: data-sync

on:
  workflow_dispatch:
  schedule:
    # f1db 主版本集中在周日晚 UTC（赛后数小时，见 releases 历史），修正版散落工作日：
    # 周日晚到周二每 2 小时密集覆盖，其余每天一次兜底；tag 门禁下无变化为零成本空转
    - cron: "23 18,20,22 * * 0"
    - cron: "23 */2 * * 1,2"
    - cron: "23 4 * * 3-6"

# 仅在上游 release tag 变化时刷新：D1 整库重导（重导期间 /teams/* 短暂
# 不可用，故用 tag 门禁收敛）。门禁状态存 D1 sync_state 表（R2 随 ingest
# 下线退役）；状态行最后一步才写入：D1 导入失败则不记录 tag，下次运行自动重试。
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download f1db release
        run: |
          curl -fsSL -o f1db-json-splitted.zip https://github.com/f1db/f1db/releases/latest/download/f1db-json-splitted.zip
          # tag 取第一跳重定向（latest -> download/<tag>/...）：不能 -L 跟到底，
          # 末跳落在 CDN 域名上没有 tag 信息；解析失败直接中止，门禁不容空 tag
          curl -sI https://github.com/f1db/f1db/releases/latest/download/f1db-json-splitted.zip \
            | awk 'tolower($1)=="location:"{u=$2} END{split(u,a,"/download/"); split(a[2],b,"/"); print b[1]}' > f1db-tag.txt
          grep -Eq '^v[0-9][0-9A-Za-z.-]*$' f1db-tag.txt || { echo "failed to parse upstream tag: '$(cat f1db-tag.txt)'" >&2; exit 1; }
          cat f1db-tag.txt

      - name: Detect new upstream release
        id: release
        run: |
          WRANGLER=apps/web/node_modules/.bin/wrangler
          "$WRANGLER" d1 execute f1db --remote -c apps/web/wrangler.jsonc --command \
            "CREATE TABLE IF NOT EXISTS sync_state (id INTEGER PRIMARY KEY CHECK (id = 1), tag TEXT NOT NULL, fetched_at TEXT NOT NULL)" > /dev/null
          previous=$("$WRANGLER" d1 execute f1db --remote -c apps/web/wrangler.jsonc --json \
            --command "SELECT tag FROM sync_state WHERE id = 1" \
            | node -p 'const r = JSON.parse(require("fs").readFileSync(0)); const rows = (Array.isArray(r) ? r[0] : r)?.results ?? []; rows[0]?.tag ?? "none"')
          echo "previous=${previous} current=$(cat f1db-tag.txt)"
          { [ "${previous}" = "$(cat f1db-tag.txt)" ] && echo changed=false || echo changed=true; } >> "$GITHUB_OUTPUT"

      - name: Refresh D1 (f1db full)
        if: steps.release.outputs.changed == 'true'
        run: |
          ./scripts/f1db-d1-dump.sh f1db-d1
          ./scripts/f1db-d1-import.sh f1db-d1

      - name: Record sync state
        if: steps.release.outputs.changed == 'true'
        run: |
          apps/web/node_modules/.bin/wrangler d1 execute f1db --remote -c apps/web/wrangler.jsonc --command \
            "INSERT OR REPLACE INTO sync_state (id, tag, fetched_at) VALUES (1, '$(cat f1db-tag.txt)', '$(date -u +%Y-%m-%dT%H:%M:%SZ)')"
