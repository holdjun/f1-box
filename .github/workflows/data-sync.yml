name: data-sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Download f1db release
        run: |
          curl -sSL -o f1db-json-splitted.zip https://github.com/f1db/f1db/releases/latest/download/f1db-json-splitted.zip
          # tag 从重定向 URL 解析，避免未认证 API 限流
          curl -sI -L https://github.com/f1db/f1db/releases/latest/download/f1db-json-splitted.zip \
            | awk 'tolower($1)=="location:"{u=$2} END{split(u,a,"/download/"); split(a[2],b,"/"); print b[1]}' > f1db-tag.txt
          cat f1db-tag.txt

      - name: Download f1-dash static assets
        run: |
          curl -sSL -o f1-dash.tar.gz https://codeload.github.com/slowlydev/f1-dash/tar.gz/refs/heads/main
          tar -xzf f1-dash.tar.gz \
            "f1-dash-main/dashboard/public/team-logos" \
            "f1-dash-main/dashboard/public/country-flags" \
            "f1-dash-main/dashboard/public/tires"

      - name: Download Fast-F1 team colors
        run: |
          curl -sSL -o fastf1-constants.json https://raw.githubusercontent.com/theOehrly/Fast-F1/main/fastf1/plotting/constants.json

      - name: Download 2026 team logos (official white)
        run: |
          mkdir -p logos-2026
          declare -A MAP=( [alpine]=alpine [astonmartin]=aston-martin [audi]=audi [cadillac]=cadillac [ferrari]=ferrari [haasf1team]=haas [mclaren]=mclaren [mercedes]=mercedes [racingbulls]=racing-bulls [redbullracing]=red-bull [williams]=williams )
          for slug in "${!MAP[@]}"; do
            curl -sS -o "logos-2026/${MAP[$slug]}.webp" \
              "https://media.formula1.com/image/upload/c_lfill,w_200/q_auto/v1740000001/common/f1/2026/$slug/2026${slug}logowhite.webp"
          done
          ls -la logos-2026

      - name: Publish vendor data to R2
        run: |
          npm install -g wrangler >/dev/null 2>&1
          BUCKET=f1-box-data
          wrangler r2 object put --remote "$BUCKET/vendor/f1db/f1db-json-splitted.zip" --file f1db-json-splitted.zip
          printf '{"source":"f1db","repo":"https://github.com/f1db/f1db","tag":"%s","fetchedAt":"%s","license":"CC-BY-4.0","artifact":"vendor/f1db/f1db-json-splitted.zip"}\n' \
            "$(cat f1db-tag.txt)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > f1db-release.json
          wrangler r2 object put --remote "$BUCKET/vendor/f1db/release.json" --file f1db-release.json
          printf '{"source":"f1-dash","repo":"https://github.com/slowlydev/f1-dash","ref":"main","fetchedAt":"%s","license":"AGPL-3.0 (assets: public-domain flags, trademarked logos)","artifacts":["vendor/f1-dash/team-logos/","vendor/f1-dash/country-flags/","vendor/f1-dash/tires/"]}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > f1-dash-release.json
          wrangler r2 object put --remote "$BUCKET/vendor/f1-dash/release.json" --file f1-dash-release.json
          for f in f1-dash-main/dashboard/public/team-logos/*.svg; do
            wrangler r2 object put --remote "$BUCKET/vendor/f1-dash/team-logos/$(basename "$f")" --file "$f"
          done
          for f in f1-dash-main/dashboard/public/country-flags/*.svg; do
            wrangler r2 object put --remote "$BUCKET/vendor/f1-dash/country-flags/$(basename "$f")" --file "$f"
          done
          for f in f1-dash-main/dashboard/public/tires/*.svg; do
            wrangler r2 object put --remote "$BUCKET/vendor/f1-dash/tires/$(basename "$f")" --file "$f"
          done
          wrangler r2 object put --remote "$BUCKET/vendor/fast-f1/constants.json" --file fastf1-constants.json
          printf '{"source":"Fast-F1","repo":"https://github.com/theOehrly/Fast-F1","ref":"main","fetchedAt":"%s","license":"MIT","artifact":"vendor/fast-f1/constants.json"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > fast-f1-release.json
          wrangler r2 object put --remote "$BUCKET/vendor/fast-f1/release.json" --file fast-f1-release.json
          for f in logos-2026/*.webp; do
            wrangler r2 object put --remote "$BUCKET/vendor/team-logos/2026/$(basename "$f")" --file "$f"
          done
          printf '{"source":"formula1.com CDN","fetchedAt":"%s","license":"trademarked, identification use","season":2026,"artifacts":["vendor/team-logos/2026/"]}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > team-logos-release.json
          wrangler r2 object put --remote "$BUCKET/vendor/team-logos/release.json" --file team-logos-release.json

      - name: Verify
        run: |
          wrangler r2 object get --remote f1-box-data/vendor/f1db/release.json --file /dev/stdout
          echo
          wrangler r2 object get --remote f1-box-data/vendor/f1-dash/release.json --file /dev/stdout
