name: data-sync

on:
  workflow_dispatch:
  schedule:
    # f1db 主版本集中在周日晚 UTC（赛后数小时，见 releases 历史），修正版散落工作日：
    # 周日晚到周二每 2 小时密集覆盖，其余每天一次兜底；tag 门禁下无变化为零成本空转
    - cron: "23 18,20,22 * * 0"
    - cron: "23 */2 * * 1,2"
    - cron: "23 4 * * 3-6"

permissions:
  contents: read

# 定时与手动触发可能重叠；排队而非取消，避免打断进行中的 D1 全量重导，
# 后到者过 tag 门禁后自然空转
concurrency:
  group: data-sync
  cancel-in-progress: false

# 仅在上游 release tag 变化时刷新：D1 整库重导（重导期间 /teams/* 短暂
# 不可用，故用 tag 门禁收敛）。门禁状态存 D1 sync_state 表（R2 随 ingest
# 下线退役）；状态行最后一步才写入：D1 导入失败则不记录 tag，下次运行自动重试。
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download f1db release
        run: |
          curl -fsSL -o f1db-json-splitted.zip https://github.com/f1db/f1db/releases/latest/download/f1db-json-splitted.zip
          # tag 取第一跳重定向（latest -> download/<tag>/...）：不能 -L 跟到底，
          # 末跳落在 CDN 域名上没有 tag 信息；解析失败直接中止，门禁不容空 tag
          curl -sI https://github.com/f1db/f1db/releases/latest/download/f1db-json-splitted.zip \
            | awk 'tolower($1)=="location:"{u=$2} END{split(u,a,"/download/"); split(a[2],b,"/"); print b[1]}' > f1db-tag.txt
          grep -Eq '^v[0-9][0-9A-Za-z.-]*$' f1db-tag.txt || { echo "failed to parse upstream tag: '$(cat f1db-tag.txt)'" >&2; exit 1; }
          cat f1db-tag.txt

      - name: Detect new upstream release
        id: release
        run: |
          WRANGLER=apps/web/node_modules/.bin/wrangler
          "$WRANGLER" d1 execute f1db --remote -c apps/web/wrangler.jsonc --command \
            "CREATE TABLE IF NOT EXISTS sync_state (id INTEGER PRIMARY KEY CHECK (id = 1), tag TEXT NOT NULL, fetched_at TEXT NOT NULL)" > /dev/null
          previous=$("$WRANGLER" d1 execute f1db --remote -c apps/web/wrangler.jsonc --json \
            --command "SELECT tag FROM sync_state WHERE id = 1" \
            | node -p 'const r = JSON.parse(require("fs").readFileSync(0)); const rows = (Array.isArray(r) ? r[0] : r)?.results ?? []; rows[0]?.tag ?? "none"')
          echo "previous=${previous} current=$(cat f1db-tag.txt)"
          { [ "${previous}" = "$(cat f1db-tag.txt)" ] && echo changed=false || echo changed=true; } >> "$GITHUB_OUTPUT"

      - name: Refresh D1 (f1db full)
        if: steps.release.outputs.changed == 'true'
        run: |
          ./scripts/f1db-d1-dump.sh f1db-d1
          ./scripts/f1db-d1-import.sh f1db-d1

      # 站点自己的表（session_time 等）不属于 f1db 上游，不随 dump/import 重建。
      # 全量重导后幂等创建；不同 schema 时后续还要另跑各 sync 脚本回填。
      - name: Apply site tables
        run: |
          apps/web/node_modules/.bin/wrangler d1 execute f1db --remote -c apps/web/wrangler.jsonc \
            --file scripts/site-tables.sql

      # 全量重导后 f1db 可能不再有某些场次（上游删场或改赛历）。
      # 站点表没有外键兜管，不清就会留下指向不存在比赛的行。
      - name: Prune site tables
        if: steps.release.outputs.changed == 'true'
        run: |
          WRANGLER=apps/web/node_modules/.bin/wrangler
          for table in session_time session_weather; do
            "$WRANGLER" d1 execute f1db --remote -c apps/web/wrangler.jsonc --command \
              "DELETE FROM ${table} WHERE NOT EXISTS (SELECT 1 FROM race r WHERE r.year = ${table}.year AND r.round = ${table}.round)"
          done

      # 上游改 schema 时查询计划夹具会跟着变，意味着索引可能失效。数据同步不因此中断，
      # 但要在 summary 里留下痕迹，否则只能等下一次有人本地跑 dump 才发现
      - name: Flag upstream schema drift
        if: steps.release.outputs.changed == 'true'
        run: |
          if ! git diff --quiet -- apps/web/tests/fixtures/d1-schema.sql; then
            cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ### f1db 上游 schema 变化

          本地跑 scripts/f1db-d1-dump.sh 刷新夹具并提交，确认查询计划护栏仍为绿。
          MD
            git diff -- apps/web/tests/fixtures/d1-schema.sql | head -60 >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record sync state
        if: steps.release.outputs.changed == 'true'
        run: |
          apps/web/node_modules/.bin/wrangler d1 execute f1db --remote -c apps/web/wrangler.jsonc --command \
            "INSERT OR REPLACE INTO sync_state (id, tag, fetched_at) VALUES (1, '$(cat f1db-tag.txt)', '$(date -u +%Y-%m-%dT%H:%M:%SZ)')"

      # 边缘 TTL 按周更的数据节奏设，新数据靠这里主动推翻。清不掉只会让页面滑到
      # SWR 窗口里取旧副本，不影响可用性，故不阻断同步
      - name: Purge edge cache
        if: steps.release.outputs.changed == 'true'
        continue-on-error: true
        run: |
          zone=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=f1-box.com" \
            | node -p 'JSON.parse(require("fs").readFileSync(0)).result?.[0]?.id ?? ""')
          [ -n "$zone" ] || { echo "zone lookup failed" >&2; exit 1; }
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"tags":["f1db"]}' \
            | node -p 'JSON.parse(require("fs").readFileSync(0)).success ? "purged f1db" : (console.error(require("fs").readFileSync(0)), process.exit(1))'
