name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR 连续 push 取消过时流水线；main 排队而非取消，避免打断进行中的生产部署。
# verify 与部署合并在一条流水线里，生产部署由 verify 结构性门禁
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check 已含 biome ci（根 package.json），本地与 CI 走同一入口
      - run: pnpm check
      - run: pnpm test
      - run: pnpm -r build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @f1-box/web exec playwright install --with-deps chromium
      - run: pnpm --filter @f1-box/web test:e2e

  preview:
    # fork PR 读不到仓库 secrets，跳过部署只跑 verify，避免 CI 红在 wrangler 认证上
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @f1-box/web build
        env:
          F1BOX_WRANGLER_CONFIG: ./wrangler.preview.jsonc
      # 新代码引用站点表时必须先建表；preview 与 production 共用该 D1，建表幂等。
      - name: Apply site tables
        run: |
          apps/web/node_modules/.bin/wrangler d1 execute f1db --remote \
            -c apps/web/wrangler.preview.jsonc --file scripts/site-tables.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 凭据只给真正要用的步骤：放在 job 级 env 上时，依赖安装与构建里跑的任意
      # 第三方代码都能读到它
      - run: pnpm --filter @f1-box/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test preview
        run: |
          for path in /racing/2026 /results/2026/races /results/2026/races/australia/race-result; do
            curl --retry 5 --retry-delay 2 --retry-all-errors -fsS \
              "https://f1-box-preview.rj7c4mhzcp.workers.dev${path}" > /dev/null
          done

  production:
    # 显式锁定 main：部署生产的边界守卫，不依赖触发器配置的隐式保证
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @f1-box/web build
      - name: Apply site tables
        run: |
          apps/web/node_modules/.bin/wrangler d1 execute f1db --remote \
            -c apps/web/wrangler.jsonc --file scripts/site-tables.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm --filter @f1-box/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test production
        run: |
          for path in /racing/2026 /results/2026/races /results/2026/races/australia/race-result; do
            curl --retry 5 --retry-delay 2 --retry-all-errors -fsS \
              "https://f1-box.com${path}" > /dev/null
          done
