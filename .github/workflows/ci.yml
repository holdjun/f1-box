name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Generated contracts are up to date
        run: pnpm --filter @f1-box/contracts generate && git diff --exit-code
      - run: pnpm -r build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @f1-box/web exec playwright install --with-deps chromium
      - run: pnpm --filter @f1-box/web test:e2e
      - run: uv sync --project services/ingest
      - run: uv run --project services/ingest pytest -q
      - run: uv run --project services/ingest ruff check
