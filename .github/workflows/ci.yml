name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR 连续 push 取消过时流水线；main 排队而非取消，避免打断进行中的生产部署。
# verify 与部署合并在一条流水线里，生产部署由 verify 结构性门禁
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  weather_changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect weather ingestion changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if git diff --quiet "$base" "$HEAD_SHA" -- \
            apps/weather-sync scripts/site-tables.sql scripts/sync-session-refs.py \
            scripts/f1_session_keys.py .github/workflows/ci.yml \
            .github/workflows/weather-data.yml pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check 已含 biome ci（根 package.json），本地与 CI 走同一入口
      - run: pnpm check
      - run: pnpm test
      - run: pnpm -r build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @f1-box/web exec playwright install --with-deps chromium
      - run: pnpm --filter @f1-box/web test:e2e

  preview:
    # fork PR 读不到仓库 secrets，跳过部署只跑 verify，避免 CI 红在 wrangler 认证上
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @f1-box/web build
        env:
          F1BOX_WRANGLER_CONFIG: ./wrangler.preview.jsonc
      # 新代码引用站点表时必须先建表；preview 与 production 共用该 D1，建表幂等。
      - name: Apply site tables
        run: |
          apps/web/node_modules/.bin/wrangler d1 execute f1db --remote \
            -c apps/web/wrangler.preview.jsonc --file scripts/site-tables.sql
          apps/web/node_modules/.bin/wrangler d1 migrations apply f1db --remote \
            -c apps/web/wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 凭据只给真正要用的这一步：放在 job 级 env 上时，依赖安装与构建里跑的任意
      # 第三方代码都能读到它
      - run: pnpm --filter @f1-box/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  weather-preview:
    # 独立 preview D1 + 无 cron；这里跑一次真实 canary，不写生产数据。
    needs: [verify, weather_changes]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.weather_changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install uv
        run: |
          python3 -m pip install --quiet --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply preview site tables
        run: |
          apps/web/node_modules/.bin/wrangler d1 execute f1db-weather-preview --remote \
            -c apps/weather-sync/wrangler.preview.jsonc --file scripts/site-tables.sql
          apps/web/node_modules/.bin/wrangler d1 migrations apply f1db-weather-preview --remote \
            -c apps/weather-sync/wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate preview session references
        run: uv run scripts/sync-session-refs.py --out /tmp/session-refs.sql --years 2023

      - name: Apply preview session references
        run: |
          apps/web/node_modules/.bin/wrangler d1 execute f1db-weather-preview --remote \
            -c apps/weather-sync/wrangler.preview.jsonc --file /tmp/session-refs.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Reset preview weather state
        run: |
          apps/web/node_modules/.bin/wrangler d1 execute f1db-weather-preview --remote \
            -c apps/weather-sync/wrangler.preview.jsonc \
            --command "DELETE FROM weather_sync_state; DELETE FROM session_weather; DELETE FROM weather_cache_outbox; DELETE FROM weather_sync_lock;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy weather preview
        run: |
          secrets_file=$(mktemp)
          chmod 600 "$secrets_file"
          trap 'rm -f "$secrets_file"' EXIT
          printf 'WEATHER_SYNC_TOKEN=%s\nWEATHER_CONTAINER_TOKEN=%s\n' \
            "$WEATHER_SYNC_TOKEN" "$WEATHER_CONTAINER_TOKEN" > "$secrets_file"
          pnpm --filter @f1-box/weather-sync exec wrangler deploy \
            --config wrangler.preview.jsonc --secrets-file "$secrets_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEATHER_SYNC_TOKEN: ${{ secrets.WEATHER_SYNC_TOKEN }}
          WEATHER_CONTAINER_TOKEN: ${{ secrets.WEATHER_CONTAINER_TOKEN || secrets.WEATHER_SYNC_TOKEN }}

      - name: Smoke test weather preview
        run: |
          curl --retry 10 --retry-delay 5 --retry-all-errors -fsS \
            "https://f1-box-weather-sync-preview.rj7c4mhzcp.workers.dev/health" > /dev/null

      - name: Run one-session canary
        run: |
          curl --retry 5 --retry-delay 10 --retry-all-errors -fsS -X POST \
            -H "Authorization: Bearer $WEATHER_SYNC_TOKEN" \
            -H "content-type: application/json" \
            -d '{"limit":1}' \
            "https://f1-box-weather-sync-preview.rj7c4mhzcp.workers.dev/run" > /tmp/weather-run.json
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsS \
            -H "Authorization: Bearer $WEATHER_SYNC_TOKEN" \
            "https://f1-box-weather-sync-preview.rj7c4mhzcp.workers.dev/status" > /tmp/weather-status.json
          cat /tmp/weather-run.json
          cat /tmp/weather-status.json
          node <<'NODE'
          const result = JSON.parse(
            require("fs").readFileSync("/tmp/weather-run.json", "utf8"),
          );
          const status = JSON.parse(
            require("fs").readFileSync("/tmp/weather-status.json", "utf8"),
          );
          const success = status.statuses.find((row) => row.status === "success");
          if (
            result.requested !== 1 ||
            result.success !== 1 ||
            status.weatherRows !== 1 ||
            success?.count !== 1
          ) {
            console.error(
              `weather canary did not persist one row: ${JSON.stringify({ result, status })}`,
            );
            process.exit(1);
          }
          NODE
        env:
          WEATHER_SYNC_TOKEN: ${{ secrets.WEATHER_SYNC_TOKEN }}

  production:
    # 显式锁定 main：部署生产的边界守卫，不依赖触发器配置的隐式保证
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @f1-box/web build
      - name: Apply site tables
        run: |
          apps/web/node_modules/.bin/wrangler d1 execute f1db --remote \
            -c apps/web/wrangler.jsonc --file scripts/site-tables.sql
          apps/web/node_modules/.bin/wrangler d1 migrations apply f1db --remote \
            -c apps/web/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm --filter @f1-box/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  weather-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 生产 D1 迁移由 web 部署先落地；weather worker 的新 upsert 不能抢在列存在前上线
    needs: [verify, production]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply site tables
        run: |
          apps/web/node_modules/.bin/wrangler d1 execute f1db --remote \
            -c apps/web/wrangler.jsonc --file scripts/site-tables.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy weather sync
        run: |
          secrets_file=$(mktemp)
          chmod 600 "$secrets_file"
          trap 'rm -f "$secrets_file"' EXIT
          printf 'WEATHER_SYNC_TOKEN=%s\nWEATHER_CONTAINER_TOKEN=%s\nCLOUDFLARE_API_TOKEN=%s\n' \
            "$WEATHER_SYNC_TOKEN" "$WEATHER_CONTAINER_TOKEN" "$CLOUDFLARE_API_TOKEN" \
            > "$secrets_file"
          pnpm --filter @f1-box/weather-sync exec wrangler deploy \
            --config wrangler.jsonc --secrets-file "$secrets_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEATHER_SYNC_TOKEN: ${{ secrets.WEATHER_SYNC_TOKEN }}
          WEATHER_CONTAINER_TOKEN: ${{ secrets.WEATHER_CONTAINER_TOKEN || secrets.WEATHER_SYNC_TOKEN }}
      - name: Smoke test weather sync
        run: |
          curl --retry 10 --retry-delay 5 --retry-all-errors -fsS \
            "https://f1-box-weather-sync.rj7c4mhzcp.workers.dev/health" > /dev/null
