[project]
name = "f1box-ingest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
